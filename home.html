<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Post Idealist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #d4d4c1; font-family: 'Lora', Georgia, serif; min-height: 100vh; }
    ::selection { background: #e67e22; color: #1a1a2e; }
    a { color: #4a9aea; text-decoration: none; }
    a:hover { color: #e67e22; text-decoration: underline; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #0f0f23; }
    ::-webkit-scrollbar-thumb { background: #333366; border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a8a; }
    button { font-family: inherit; }
    input, select, textarea { font-family: 'Courier Prime', monospace; background: #12122a; color: #d4d4c1; border: 1px solid #333366; padding: 8px 12px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #4a9aea; }
    @media (max-width: 768px) {
      .site-layout { flex-direction: column !important; }
      .site-sidebar { width: 100% !important; order: 2; }
      .site-main { order: 1; }
      .nav-bar { gap: 0 !important; }
      .nav-bar button { padding: 8px 14px !important; font-size: 12px !important; letter-spacing: 1px !important; }
      .feed-item { flex-direction: column !important; gap: 10px !important; }
      .feed-icon { width: 40px !important; height: 40px !important; font-size: 12px !important; }
      .feed-meta { flex-direction: column !important; gap: 2px !important; }
      .top-bar { flex-direction: column !important; gap: 2px !important; text-align: center !important; font-size: 11px !important; }
      .tool-header { flex-direction: column !important; }
      .algo-row { font-size: 11px !important; }
      .algo-row > div:nth-child(2) { width: 60px !important; }
    }
    @media (max-width: 480px) {
      .site-title { font-size: 28px !important; letter-spacing: 3px !important; }
      .article-body { padding: 20px !important; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel" src="viz.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const VISITOR_COUNT = Math.floor(Math.random() * 1000001).toLocaleString('en-US').padStart(7, '0');

    // ==========================================
    // DATA FETCHING
    // ==========================================
    function useContent() {
      const [content, setContent] = useState(null);
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        fetch('content.json?v=' + Date.now()).then(r => r.json())
          .then(data => { setContent(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);
      return { content, loading };
    }

    function useJsonFile(filePath) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      useEffect(() => {
        if (!filePath) { setData(null); return; }
        setLoading(true);
        fetch(filePath + '?v=' + Date.now()).then(r => r.json())
          .then(d => { setData(d); setLoading(false); })
          .catch(() => setLoading(false));
      }, [filePath]);
      return { data, loading };
    }

    // ==========================================
    // ARTICLE SECTION RENDERERS
    // ==========================================
    function ScreenshotBox({ number, title, children }) {
      return (
        <div style={{ margin: "28px 0", border: "2px solid #333366", background: "#0a0a18", overflow: "hidden" }}>
          <div style={{ background: "#222244", padding: "6px 14px", fontFamily: "'VT323', monospace", fontSize: "13px", color: "#666680", borderBottom: "1px solid #333366", display: "flex", justifyContent: "space-between" }}>
            <span>Screenshot #{number}{title ? ": " + title : ""}</span>
            <span style={{ color: "#444460" }}>{"\u2715"}</span>
          </div>
          <div style={{ padding: "20px" }}>{children}</div>
        </div>
      );
    }

    function redact(text) {
      if (!text || typeof text !== 'string') return text;
      if (!text.includes('[R]') && !text.includes('[I]')) return text;
      const parts = [];
      let remaining = text;
      let key = 0;
      while (remaining.includes('[R]') || remaining.includes('[I]')) {
        const rIdx = remaining.indexOf('[R]');
        const iIdx = remaining.indexOf('[I]');
        const useR = rIdx !== -1 && (iIdx === -1 || rIdx < iIdx);
        const tag = useR ? '[R]' : '[I]';
        const closeTag = useR ? '[/R]' : '[/I]';
        const start = useR ? rIdx : iIdx;
        const end = remaining.indexOf(closeTag);
        if (end === -1) break;
        if (start > 0) parts.push(remaining.slice(0, start));
        const inner = remaining.slice(start + tag.length, end);
        if (useR) {
          parts.push(
            React.createElement('span', { key: key++, style: { background: '#111', color: '#111', padding: '1px 2px', borderRadius: '2px', userSelect: 'none', cursor: 'default', border: '1px solid #222', letterSpacing: '0px' }, title: 'REDACTED' }, inner)
          );
        } else {
          parts.push(
            React.createElement('span', { key: key++, style: { color: 'transparent', transition: 'color 0.3s', cursor: 'default' }, onMouseEnter: e => { e.target.style.color = '#666680'; }, onMouseLeave: e => { e.target.style.color = 'transparent'; } }, inner)
          );
        }
        remaining = remaining.slice(end + closeTag.length);
      }
      if (remaining) parts.push(remaining);
      return parts.length ? parts : text;
    }

    function ChatMessage({ speaker, text }) {
      const isU = speaker === "Unconscious";
      return (
        <div style={{ marginBottom: "8px", fontFamily: "'Courier Prime', monospace", fontSize: "14px", lineHeight: 1.8, color: "#b0b0a0" }}>
          <span style={{ color: isU ? "#e67e22" : "#4a9aea", fontWeight: "bold" }}>{isU ? "The Unconscious" : "Person " + speaker}:</span> <span>{redact(text)}</span>
        </div>
      );
    }

    function AlgorithmTable({ rows }) {
      return (
        <div>
          <div style={{ fontFamily: "'VT323', monospace", fontSize: "14px", color: "#666680", textAlign: "center", marginBottom: "12px", letterSpacing: "1px" }}>THE ALGORITHM'S THOUGHTS WHILE CHASING WATCHTIME</div>
          <div className="algo-row" style={{ display: "flex", borderBottom: "2px solid #333366", fontSize: "12px", fontFamily: "'VT323', monospace", color: "#4a4a8a", letterSpacing: "1px" }}>
            <div style={{ flex: 2, padding: "6px 10px" }}>VIDEO</div>
            <div style={{ width: "90px", padding: "6px 10px", textAlign: "center", borderLeft: "1px solid #222244" }}>WATCH TIME</div>
            <div style={{ flex: 3, padding: "6px 10px", borderLeft: "1px solid #222244" }}>ALGORITHM THINKS...</div>
          </div>
          {rows.map((row, i) => (
            <div key={i} className="algo-row" style={{ display: "flex", borderBottom: "1px solid #222244", fontSize: "13px" }}>
              <div style={{ flex: 2, padding: "8px 10px", color: "#c0c0b0" }}>{redact(row.title)}</div>
              <div style={{ width: "90px", padding: "8px 10px", color: "#666680", textAlign: "center", borderLeft: "1px solid #222244" }}>{row.time}</div>
              <div style={{ flex: 3, padding: "8px 10px", color: "#4a90d9", fontStyle: "italic", borderLeft: "1px solid #222244" }}>{redact(row.thought)}</div>
            </div>
          ))}
        </div>
      );
    }


    function RenderArticleSection({ section }) {
      switch (section.type) {
        case "text": return <p style={{ fontSize: "16px", lineHeight: 1.9, color: "#c8c8b8", marginBottom: "20px" }}>{redact(section.content)}</p>;
        case "heading": return <h3 style={{ fontFamily: "'Special Elite', monospace", fontSize: "22px", color: "#e67e22", marginBottom: "12px", marginTop: "32px" }}>{section.content}</h3>;
        case "note": return <p style={{ fontSize: "14px", color: "#666680", fontStyle: "italic", marginBottom: "20px" }}>{redact(section.content)}</p>;
        case "plug": {
          const pc = section.color || "#e67e22";
          return (
            <div style={{ marginTop: "32px", paddingTop: "20px", borderTop: "1px dashed #333366" }}>
              <p style={{ fontSize: "15px", color: "#888880", lineHeight: 1.7 }}>{redact(section.content)}</p>
              {section.url && <a href={section.url} target="_blank" rel="noopener" style={{ display: "inline-block", marginTop: "12px", background: pc, color: "#fff", padding: "8px 24px", fontFamily: "'Courier Prime', monospace", fontSize: "13px", fontWeight: "bold", letterSpacing: "2px", textTransform: "uppercase", textDecoration: "none" }}>{(section.label || "Try it") + " \u2192"}</a>}
            </div>
          );
        }
        case "viz": {
          const registry = window.ARTICLE_VIZ_MODULES || {};
          const mod = registry[section.module];
          return mod ? mod() : null;
        }
        case "screenshot": {
          const s = section;
          return (
            <ScreenshotBox number={s.number} title={s.title}>
              {s.style === "text" && <p style={{ textAlign: "center", color: s.dimmed ? "#555560" : "#888880", fontStyle: s.dimmed ? "italic" : "normal", fontFamily: "'Courier Prime', monospace", fontSize: "14px", lineHeight: 1.8, whiteSpace: "pre-line" }}>{redact(s.content)}</p>}
              {s.style === "lines" && <div style={{ textAlign: "center", lineHeight: 2.2, fontFamily: "'Courier Prime', monospace", fontSize: "14px", color: "#b0b0a0" }}>{s.content.map((l, i) => <div key={i} style={l.highlight ? { color: "#e67e22", fontWeight: "bold" } : {}}>{redact(l.text)}</div>)}</div>}
              {s.style === "chat" && <div style={{ padding: "12px 0" }}>{s.content.map((m, i) => <ChatMessage key={i} speaker={m.speaker} text={m.text} />)}</div>}
              {s.style === "algorithm" && <AlgorithmTable rows={s.content} />}
            </ScreenshotBox>
          );
        }
        default: return null;
      }
    }

    // ==========================================
    // SCENE ART — pixel-art panels for interactive fiction
    // ==========================================
    // An interactive article opts in with "sceneArt": "<key>" at its top level.
    // SCENE_ART[key][sceneId] is a draw(k, f) function called every frame on a
    // 190x80 grid at 3x, where f counts 60fps frames since the scene opened
    // (paused while the panel is off screen). A scene with no entry gets no panel.
    function makePixelKit(ctx, S, W, H) {
      return {
        W, H, S, ctx,
        px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x) * S, Math.round(y) * S, Math.round(w) * S, Math.round(h) * S); },
        a(alpha, fn) { const p = ctx.globalAlpha; ctx.globalAlpha = p * Math.max(0, Math.min(1, alpha)); fn(); ctx.globalAlpha = p; },
        glow(x, y, r, rgb, alpha) {
          if (alpha <= 0) return;
          const g = ctx.createRadialGradient(x * S, y * S, 0, x * S, y * S, r * S);
          g.addColorStop(0, 'rgba(' + rgb + ',' + Math.min(1, alpha) + ')');
          g.addColorStop(1, 'rgba(' + rgb + ',0)');
          ctx.fillStyle = g; ctx.fillRect((x - r) * S, (y - r) * S, 2 * r * S, 2 * r * S);
        },
        hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); },
        ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); },
        ramp(f, a, b) { return Math.max(0, Math.min(1, (f - a) / (b - a))); },
        text(s, x, y, size, c, align) {
          ctx.font = (size * S) + "px 'VT323', monospace"; ctx.textAlign = align || 'center'; ctx.textBaseline = 'top';
          ctx.fillStyle = c; ctx.fillText(s, x * S, y * S);
        },
        shake(dx, dy) { ctx.translate(dx * S, dy * S); },
      };
    }

    const CK = {
      FACE: [
        "...GG.GGGG.GG...",
        "..GGGGGGGGGGGG..",
        ".GGGGWWWWWWGGGG.",
        "GGGWWWWWWWWWWGGG",
        "GGWWBWWWWWWBWWGG",
        "GGWBEBWWWWBEBWGG",
        "GGWWBWWWWWWBWWGG",
        ".GWWWWWWWWWWWWG.",
        ".GWWWWWWWWWWWWG.",
        ".WRWWWWWWWWWWRW.",
        ".WRRWWWWWWWWRRW.",
        "..WRRRRRRRRRRW..",
        "..WWRRDDDDRRWW..",
        "...WWRRRRRRWW...",
        "....WWWWWWWW....",
        "......WWWW......",
      ],
      DONKEY: [
        "..EE..........EE..",
        "..EIE........EIE..",
        "..EIE........EIE..",
        "..EIE........EIE..",
        "..EEE........EEE..",
        "...EEGGGGGGGGEE...",
        "...GGGGGGGGGGGG...",
        "..GGGGGGGGGGGGGG..",
        "..GGOOGGGGGGOOGG..",
        "..GGOPGGGGGGPOGG..",
        "..GGGGGGGGGGGGGG..",
        "...GGGGGGGGGGGG...",
        "....GGGGGGGGGG....",
        "....GMMMMMMMMG....",
        "....MMMMMMMMMM....",
        "....MMNMMMMNMM....",
        "....MMMMMMMMMM....",
        ".....MMMMMMMM.....",
        "......MMMMMM......",
      ],

      grid(k, rows, x, y, u, color) {
        rows.forEach((row, r) => {
          for (let c = 0; c < row.length; c++) { const col = color(row[c], c, r); if (col) k.px(x + c * u, y + r * u, u, u, col); }
        });
      },

      // The painted face. half: only the right half is painted and there's no
      // grin or wig yet (the van ride). gaze: -1 left .. 1 right.
      face(k, x, y, u, o = {}) {
        const half = !!o.half;
        CK.grid(k, CK.FACE, x, y, u, (ch, c) => {
          const painted = !half || c >= 8, base = painted ? '#f2f0ea' : '#e0b090';
          if (ch === 'G') return half ? '#2a1a10' : '#33cc44';
          if (ch === 'W') return base;
          if (ch === 'B') return painted ? '#151515' : base;
          if (ch === 'E') return o.blink ? '#151515' : '#f8f8f8';
          if (ch === 'R') return half ? base : (o.grin || '#d01818');
          if (ch === 'D') return half ? '#8a4a3a' : '#4a0808';
          return null;
        });
        if (!o.blink) {
          const ps = Math.max(1, Math.floor(u / 2)), off = Math.round(((o.gaze || 0) + 1) / 2 * (u - ps));
          [4, 11].forEach(c => k.px(x + c * u + off, y + 5 * u + Math.floor((u - ps) / 2), ps, ps, o.pupil || '#111'));
        }
      },

      donkeyFace(k, x, y, u, o = {}) {
        CK.grid(k, CK.DONKEY, x, y, u, ch => ({ E: '#55555c', I: '#c8a0a0', G: '#7a7a82', O: '#1a1a1a', P: o.pupil || '#3a3a3a', M: '#b8b4ac', N: o.flare ? '#120c0a' : '#2a2420' })[ch] || null);
        if (o.flare) { k.px(x + 6 * u - 1, y + 15 * u, 1, u, '#120c0a'); k.px(x + 12 * u, y + 15 * u, 1, u, '#120c0a'); }
      },

      stars(k, f, n, maxY, seed) {
        for (let i = 0; i < n; i++) {
          const x = Math.floor(k.hash(i + seed) * k.W), y = Math.floor(k.hash(i * 7.3 + seed) * maxY);
          if (Math.sin(f * 0.03 + i * 1.7) > -0.6) k.px(x, y, 1, 1, i % 5 === 0 ? '#ffffff' : '#8890b0');
        }
      },

      pine(k, x, base, h, c) {
        for (let i = 0; i < h; i += 2) { const w = 1 + Math.floor(i * 0.55); k.px(x - Math.floor(w / 2), base - h + i, w, 2, c); }
      },

      treeline(k, base, h, c, seed, step) {
        for (let x = -6; x < k.W + 8; x += step) CK.pine(k, x + Math.floor(k.hash(x + seed) * 4), base, h + Math.floor(k.hash(x * 3 + seed) * h * 0.5), c);
      },

      eyes(k, x, y, hex, rgb, gap) {
        k.glow(x + gap / 2, y, 5, rgb, 0.35);
        k.px(x, y, 1, 1, hex); k.px(x + gap, y, 1, 1, hex);
      },

      // White van, side on, facing right. y is the ground line.
      van(k, x, y, o = {}) {
        const b = o.body || '#d8d8d0', s = o.shade || '#a8a8a0';
        k.px(x, y - 15, 22, 12, b);
        k.px(x + 22, y - 12, 7, 9, b);
        k.px(x + 22, y - 11, 5, 4, o.glass || '#3a4a5a');
        k.px(x, y - 5, 29, 2, s);
        k.px(x + 3, y - 4, 5, 4, '#141414'); k.px(x + 20, y - 4, 5, 4, '#141414');
        k.px(x + 5, y - 3, 1, 1, '#666'); k.px(x + 22, y - 3, 1, 1, '#666');
        if (o.door) k.px(x + 21, y - 12, 1, 9, '#1a1a1a');
        if (o.lights) k.px(x + 28, y - 8, 1, 2, '#fff8c0');
      },

      // The clown, front on. x is the centre, y the feet. Each stage of the
      // transformation is a flag: paint, wig, long (arms), shoes, gloves.
      clown(k, x, y, o = {}) {
        const suit = '#e8e2d4', red = '#cc3333', blue = '#3a66cc';
        const skin = o.paint ? '#f2f0ea' : '#e0b090', st = Math.round(o.step || 0), legH = o.shoes ? 7 : 8;
        k.px(x - 3 + st, y - 9, 2, legH, suit);
        k.px(x + 1 - st, y - 9, 2, legH, suit);
        if (o.shoes) { k.px(x - 6 + st, y - 2, 5, 2, '#cc2222'); k.px(x + 1 - st, y - 2, 5, 2, '#cc2222'); }
        else { k.px(x - 3 + st, y - 1, 2, 1, '#111'); k.px(x + 1 - st, y - 1, 2, 1, '#111'); }
        k.px(x - 4, y - 19, 8, 10, suit);
        [[-3, -17, red], [1, -16, blue], [-2, -13, blue], [2, -12, red], [-3, -10, red], [1, -10, blue]].forEach(([dx, dy, c]) => k.px(x + dx, y + dy, 1, 1, c));
        k.px(x - 4, y - 19, 8, 1, red);
        const al = o.long ? 14 : 8, hand = o.gloves ? '#ffffff' : skin;
        k.px(x - 5, y - 18, 1, al, suit); k.px(x - 5, y - 18 + al, 1, 1, hand);
        if (o.reach) { k.px(x + 4, y - 18, al, 1, suit); k.px(x + 4 + al, y - 19, 1, 2, hand); }
        else { k.px(x + 4, y - 18, 1, al, suit); k.px(x + 4, y - 18 + al, 1, 1, hand); }
        k.px(x - 2, y - 24, 5, 5, skin);
        if (!o.back) {
          k.px(x - 1, y - 22, 1, 1, '#111'); k.px(x + 1, y - 22, 1, 1, '#111');
          const g = o.grinC || '#d02020';
          if (o.paint) { k.px(x - 2, y - 20, 5, 1, g); k.px(x - 2, y - 21, 1, 1, g); k.px(x + 2, y - 21, 1, 1, g); }
          else k.px(x - 1, y - 20, 3, 1, '#9a5a4a');
        }
        if (o.wig) {
          const j = Math.floor((o.f || 0) / 7) % 2;
          k.px(x - 4, y - 27, 9, 3, '#33cc44'); k.px(x - 4, y - 24, 2, 4, '#33cc44'); k.px(x + 3, y - 24, 2, 4, '#33cc44');
          k.px(x - 5 + j, y - 26, 1, 2, '#55ee66'); k.px(x + 3 - j, y - 28, 2, 1, '#55ee66');
          if (o.back) k.px(x - 2, y - 24, 5, 4, '#33cc44');
        } else {
          k.px(x - 2, y - 25, 5, 2, '#2a1a10');
          if (o.back) k.px(x - 2, y - 24, 5, 3, '#2a1a10');
        }
      },

      // Milo off duty: flannel, jeans, no paint.
      man(k, x, y) {
        k.px(x - 3, y - 1, 2, 1, '#3a2414'); k.px(x + 1, y - 1, 2, 1, '#3a2414');
        k.px(x - 3, y - 9, 2, 8, '#3a4a6a'); k.px(x + 1, y - 9, 2, 8, '#3a4a6a');
        k.px(x - 4, y - 19, 8, 10, '#a83030');
        for (let i = 0; i < 4; i++) k.px(x - 4, y - 17 + i * 2, 8, 1, '#7a2020');
        k.px(x - 2, y - 19, 1, 10, '#7a2020'); k.px(x + 1, y - 19, 1, 10, '#7a2020');
        k.px(x - 5, y - 18, 1, 8, '#a83030'); k.px(x + 4, y - 18, 1, 8, '#a83030');
        k.px(x - 5, y - 10, 1, 1, '#e0b090'); k.px(x + 4, y - 10, 1, 1, '#e0b090');
        k.px(x - 2, y - 24, 5, 5, '#e0b090'); k.px(x - 2, y - 25, 5, 2, '#2a1a10');
        k.px(x - 1, y - 22, 1, 1, '#111'); k.px(x + 1, y - 22, 1, 1, '#111'); k.px(x - 1, y - 20, 3, 1, '#9a5a4a');
      },

      claire(k, x, y, o = {}) {
        const skin = '#e8c0a0', hair = '#6a3a1a', bl = '#3a4a6a';
        k.px(x - 2, y - 1, 2, 1, '#1a1010'); k.px(x + 1, y - 1, 2, 1, '#1a1010');
        k.px(x - 2, y - 8, 2, 7, '#24242e'); k.px(x + 1, y - 8, 2, 7, '#24242e');
        k.px(x - 3, y - 16, 7, 8, bl); k.px(x - 1, y - 16, 3, 5, '#e8e8e0');
        if (o.knife) {
          k.px(x - 3, y - 13, 7, 2, bl); k.px(x - 1, y - 12, 3, 2, skin);
          k.px(x, y - 17, 1, 5, '#e8e8f0'); k.px(x, y - 18, 1, 1, '#ffffff');
        } else {
          k.px(x - 4, y - 15, 1, 7, bl); k.px(x + 4, y - 15, 1, 7, bl);
          k.px(x - 4, y - 8, 1, 1, skin); k.px(x + 4, y - 8, 1, 1, skin);
        }
        k.px(x - 2, y - 21, 5, 5, skin);

    function prefersReducedMotion() {
      try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
    }

    // Runs a draw(k, f) function on a pixel canvas. With duration (in frames)
    // it plays once and calls onDone; otherwise it loops until unmounted.
    // Reduced motion gets a single still frame.
    function PixelCanvas({ draw, W = 190, H = 80, S = 3, duration, onDone, style }) {
      const ref = React.useRef(null);
      useEffect(() => {
        const canvas = ref.current;
        if (!canvas || !draw) return;
        const ctx = canvas.getContext('2d');
        const k = makePixelKit(ctx, S, W, H);
        const frame = f => { ctx.save(); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W * S, H * S); draw(k, f); ctx.restore(); };
        if (prefersReducedMotion() && !duration) { frame(480); return; }
        let anim, acc = 0, last = performance.now(), visible = true;
        const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { visible = es[0].intersectionRatio >= 0.5; }, { threshold: [0, 0.5, 1] }) : null;
        if (io) io.observe(canvas);
        const tick = now => {
          const dt = Math.min(now - last, 100); last = now;
          if (visible || duration) { acc += dt; frame(Math.floor(acc * 0.06)); }
          if (duration && acc * 0.06 >= duration) { if (onDone) onDone(); return; }
          anim = requestAnimationFrame(tick);
        };
        anim = requestAnimationFrame(tick);
        return () => { cancelAnimationFrame(anim); if (io) io.disconnect(); };
      }, [draw]);
      return <canvas ref={ref} width={W * S} height={H * S} aria-hidden="true" style={{ display: "block", width: "100%", height: "auto", imageRendering: "pixelated", ...style }} />;
    }

    function ArticleRenderer({ data, goBack }) {
      if (!data) return <div style={{ fontFamily: "'VT323', monospace", color: "#666680", padding: "40px", textAlign: "center" }}>Loading...</div>;
      if (data.interactive) return <InteractiveArticleRenderer data={data} goBack={goBack} />;
      return (
        <div>
          <button onClick={goBack} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", marginBottom: "20px", padding: 0 }}>{"\u2190 Back to articles"}</button>
          <article className="article-body" style={{ border: "1px solid #333366", background: "#0f0f23", padding: "40px", maxWidth: "720px" }}>

    function InteractiveArticleRenderer({ data, goBack }) {
      const [scene, setScene] = useState(data.start || "opening");
      const [history, setHistory] = useState([]);
      const [rewinding, setRewinding] = useState(false);
      const sceneRef = React.useRef(null);
      const sc = data.scenes[scene];
      const artSet = data.sceneArt ? SCENE_ART[data.sceneArt] : null;
      const art = artSet ? artSet[scene] : null;

      // Scroll to the top of the new scene, clear of the sticky header.
      const scrollToScene = () => setTimeout(() => {
        const el = sceneRef.current;
        if (!el) return;
        const hdr = document.querySelector('header');
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - (hdr ? hdr.offsetHeight : 0) - 16, behavior: "smooth" });
      }, 50);

      const goToScene = useCallback((id) => {
        setHistory(h => [...h, scene]);
        setScene(id);
        scrollToScene();
      }, [scene]);

      const finishGoBack = useCallback(() => {
        setRewinding(false);
        if (sc.goBack) {
          setScene(sc.goBack);
          setHistory(h => h.slice(0, -1));
          scrollToScene();
        }
      }, [sc]);

      // Pieces with scene art rewind the tape on the way back.
      const handleGoBack = useCallback(() => {
        if (rewinding) return;
        if (artSet && !prefersReducedMotion()) setRewinding(true);
        else finishGoBack();
      }, [rewinding, artSet, finishGoBack]);

      const isScolding = !!sc.goBack;

      return (
        <div>
          <button onClick={goBack} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", marginBottom: "20px", padding: 0 }}>{"\u2190 Back to articles"}</button>
          <article ref={sceneRef} className="article-body" style={{ border: "1px solid " + (isScolding ? "#aa3333" : "#333366"), background: "#0f0f23", padding: "40px", maxWidth: "720px", transition: "border-color 0.3s" }}>
            {scene === data.start && <>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#4a4a8a", letterSpacing: "2px", marginBottom: "8px" }}>{data.category} {"\u00b7"} {data.readTime || "10 min"} {"\u00b7"} {new Date(data.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
              <h2 style={{ fontFamily: "'Special Elite', monospace", fontSize: "34px", color: "#e8e8d0", lineHeight: 1.2, marginBottom: "6px" }}>{data.title}</h2>
              <p style={{ fontFamily: "'Courier Prime', monospace", fontSize: "16px", color: "#888880", fontStyle: "italic", marginBottom: "24px" }}>{redact(data.subtitle)}</p>
              <div style={{ width: "40px", height: "2px", background: "#e67e22", marginBottom: "28px" }} />
            </>}
            {art && (
              <div style={{ margin: "0 0 28px", border: "1px solid " + (isScolding ? "#552222" : "#222244"), background: "#000" }}>
                <PixelCanvas key={scene} draw={art} />
              </div>
            )}
            {sc.content.map((para, i) => {
              if (para === "\u2026" || para === "\u2022 \u2022 \u2022") return <div key={i} style={{ textAlign: "center", color: "#555560", fontSize: "20px", margin: "20px 0", letterSpacing: "8px" }}>{para}</div>;
              if (para === "THE END") return <div key={i} style={{ textAlign: "center", fontFamily: "'Special Elite', monospace", fontSize: "28px", color: "#e67e22", letterSpacing: "6px", margin: "32px 0" }}>{para}</div>;
              const isDialogue = para.startsWith('"') || para.startsWith('\u201c');
              return <p key={i} style={{ fontSize: "16px", lineHeight: 1.9, color: isScolding && i >= sc.content.indexOf("\u2026") + 1 ? "#c0a060" : "#c8c8b8", marginBottom: "16px", fontStyle: isDialogue ? "normal" : "italic" }}>{redact(para)}</p>;
            })}
            {sc.choices && (
              <div style={{ marginTop: "32px", paddingTop: "24px", borderTop: "2px solid #333366", display: "flex", flexDirection: "column", gap: "12px" }}>
                <div style={{ fontFamily: "'VT323', monospace", fontSize: "14px", color: "#666680", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "4px" }}>What does Claire do?</div>
                {sc.choices.map((c, i) => (
                  <button key={i} onClick={() => goToScene(c.goto)} style={{ background: "#12122a", border: "1px solid #4a4a8a", padding: "14px 20px", color: "#e8e8d0", fontFamily: "'Courier Prime', monospace", fontSize: "15px", cursor: "pointer", textAlign: "left", transition: "all 0.2s" }}
                    onMouseEnter={e => { e.target.style.borderColor = "#e67e22"; e.target.style.background = "#1a1530"; }}
                    onMouseLeave={e => { e.target.style.borderColor = "#4a4a8a"; e.target.style.background = "#12122a"; }}
                  >{"\u2192 " + c.label}</button>
                ))}
              </div>
            )}
            {sc.goBack && (
              <div style={{ marginTop: "32px", paddingTop: "24px", borderTop: "2px solid #aa3333", textAlign: "center" }}>
                <button onClick={handleGoBack} style={{ background: "none", border: "2px solid #4a9aea", padding: "12px 32px", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", letterSpacing: "1px", transition: "all 0.2s" }}
                  onMouseEnter={e => { e.target.style.background = "#4a9aea"; e.target.style.color = "#fff"; }}
                  onMouseLeave={e => { e.target.style.background = "none"; e.target.style.color = "#4a9aea"; }}
                >{"\u2190 Go back and choose differently"}</button>
              </div>
            )}
          </article>
          {rewinding && (
            <div style={{ position: "fixed", inset: 0, zIndex: 1000, background: "#000" }}>
              <PixelCanvas draw={CK.rewind} W={190} H={107} S={2} duration={96} onDone={finishGoBack} style={{ width: "100%", height: "100%", objectFit: "contain" }} />
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TOOL SECTION RENDERER
    // ==========================================
    function RenderToolSection({ section, toolData }) {
      switch (section.type) {
        case "heading": return <h3 style={{ fontFamily: "'Special Elite', monospace", fontSize: "22px", color: "#e67e22", marginBottom: "12px", marginTop: "32px" }}>{section.content}</h3>;
        case "text": return <p style={{ fontSize: "16px", lineHeight: 1.9, color: "#c0c0b0", marginBottom: "16px" }}>{section.content}</p>;
        case "features": return <div style={{ marginBottom: "24px" }}>{section.content.map((f, i) => <p key={i} style={{ fontSize: "15px", lineHeight: 1.7, color: "#b0b0a0", marginBottom: "8px", paddingLeft: "16px", borderLeft: "2px solid " + (toolData.color || "#4a90d9") }}>{f}</p>)}</div>;
        case "steps": return <div>{section.content.map((step, i) => <div key={i} style={{ display: "flex", gap: "16px", marginBottom: "16px", alignItems: "flex-start" }}><div style={{ fontFamily: "'VT323', monospace", fontSize: "24px", color: toolData.color || "#e67e22", width: "30px", textAlign: "center", flexShrink: 0 }}>{i+1}</div><div><div style={{ fontFamily: "'Courier Prime', monospace", fontSize: "15px", color: "#e8e8d0", fontWeight: "bold", marginBottom: "4px" }}>{step.title}</div><p style={{ fontSize: "15px", lineHeight: 1.7, color: "#b0b0a0" }}>{step.text}</p></div></div>)}</div>;
        case "callout": return <div style={{ marginTop: "24px", padding: "16px", background: "#1a2010", border: "1px solid #3a5a2a" }}><p style={{ fontSize: "15px", lineHeight: 1.7, color: "#b0b0a0" }}>{section.content}</p></div>;
        case "interactive": {
          const mod = INTERACTIVE_MODULES[section.module];
          return mod ? mod({ toolUrl: toolData.url }) : null;
        }
        default: return null;
      }
    }

    function ChapterRenderer({ data, chapterMeta, allChapters, goBack, onNav }) {

        <div>

              {prev ? <button onClick={() => onNav(prev.id)} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", padding: 0 }}>{"\u2190 " + prev.title}</button> : <span />}
              {next ? <button onClick={() => onNav(next.id)} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", padding: 0 }}>{next.title + " \u2192"}</button> : <span />}
            </div>
          </article>
        </div>
      );

    function ForestBanner({ onClick }) {
      const canvasRef = React.useRef(null);
      const frameRef = React.useRef(0);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        const W = canvas.width, H = canvas.height;
        const PX = 3; // pixel scale

        function drawPixelRect(x, y, w, h, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
        }

        function drawTree(ox, oy, type) {
          const colors = [
            { trunk: '#5d4037', leaves: ['#2e7d32','#388e3c','#43a047'] },
            { trunk: '#4e342e', leaves: ['#1b5e20','#2e7d32','#388e3c'] },
            { trunk: '#6d4c41', leaves: ['#558b2f','#689f38','#7cb342'] },
            { trunk: '#3e2723', leaves: ['#4a148c','#6a1b9a','#7b1fa2'] }
          ];
          const c = colors[type % 4];
          drawPixelRect(ox+4, oy+15, 3, 17, c.trunk);
          drawPixelRect(ox+5, oy+15, 1, 17, '#3e2723');
          drawPixelRect(ox, oy+3, 11, 7, c.leaves[0]);
          drawPixelRect(ox-1, oy+8, 13, 6, c.leaves[1]);
          drawPixelRect(ox+1, oy+12, 10, 5, c.leaves[2]);
          drawPixelRect(ox+2, oy, 5, 4, c.leaves[0]);
        }

        function drawPlayer(ox, oy, bob) {
          const by = Math.round(bob);
          // Cloak
          drawPixelRect(ox+3, oy+8+by, 8, 12, '#2980b9');
          drawPixelRect(ox+2, oy+20+by, 10, 4, '#2980b9');
          // Head
          drawPixelRect(ox+4, oy+3+by, 6, 6, '#fad7a0');
          // Hair
          drawPixelRect(ox+4, oy+2+by, 6, 3, '#8b4513');
          drawPixelRect(ox+3, oy+3+by, 2, 2, '#8b4513');
          // Eyes
          drawPixelRect(ox+5, oy+5+by, 2, 2, '#3498db');
          drawPixelRect(ox+8, oy+5+by, 2, 2, '#3498db');
          // Hood
          drawPixelRect(ox+2, oy+1+by, 10, 3, '#1a5276');
          drawPixelRect(ox+1, oy+3+by, 2, 6, '#1a5276');
          drawPixelRect(ox+11, oy+3+by, 2, 6, '#1a5276');
        }

        let anim;
        function render() {
          frameRef.current++;
          const f = frameRef.current;
          ctx.fillStyle = '#0a1a0a';
          ctx.fillRect(0, 0, W, H);
          // Ground
          ctx.fillStyle = '#1a472a';
          ctx.fillRect(0, 32*PX, W, H);
          // Grass spots
          const grassColors = ['#2d5a3f','#1e5631','#174023'];
          for (let i = 0; i < 20; i++) {
            ctx.fillStyle = grassColors[i%3];
            ctx.fillRect(((i*37+11)%180)*PX, (33+(i%4))*PX, 3*PX, 1*PX);
          }
          // Trees
          drawTree(4, 5, 0);
          drawTree(28, 2, 1);
          drawTree(120, 3, 3); // purple mystic tree
          drawTree(148, 6, 2);
          drawTree(170, 1, 0);
          // Player walking
          const px = 65 + Math.sin(f * 0.02) * 15;
          const bob = Math.sin(f * 0.08) * 0.6;
          drawPlayer(px, 12, bob);
          // Stars / particles
          ctx.fillStyle = '#9b59b6';
          for (let i = 0; i < 5; i++) {
            const sx = (f * 0.7 + i * 40) % 190;
            const sy = 4 + Math.sin(f * 0.03 + i * 2) * 3;
            const size = (Math.sin(f * 0.05 + i) > 0.3) ? 1 : 0;
            if (size) ctx.fillRect(sx*PX, sy*PX, PX, PX);
          }
          anim = requestAnimationFrame(render);
        }
        render();
        return () => cancelAnimationFrame(anim);
      }, []);

      return (

          onMouseEnter={e => e.currentTarget.style.borderColor = "#4a9a4a"}
          onMouseLeave={e => e.currentTarget.style.borderColor = "#2e7d32"}
        >
          <canvas ref={canvasRef} width={570} height={150}
            style={{ width: "100%", height: "auto", display: "block", imageRendering: "pixelated" }} />
          <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px", borderTop: "1px solid #1a3a1a" }}>
            <div>
              <div style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e8e8d0" }}>Mystic Forest Walker</div>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#4a9a4a", marginTop: "2px" }}>He's been walking since you opened this page. He will never stop. You might as well click him.</div>
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: "14px", color: "#2e7d32", background: "#2e7d3222", padding: "4px 12px", border: "1px solid #2e7d3255", letterSpacing: "1px" }}>PLAY</div>
          </div>
        </a>
      );
    }

    function BrickBreakerBanner() {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 570, H = 180;
        const S = 2;
        const colors = ['#e040fb','#ff1744','#ff9100','#ffea00','#00e676','#00e5ff','#2979ff','#d500f9'];
        const COLS = 19, ROWS = 4, BW = 14, BH = 5, BPAD = 1, BOFFX = 3, BOFFY = 3;
        let bricks, ball, paddle, state, stateTimer, level, anim;

        function initBricks(rows) {
          const b = [];
          for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
            b.push({ x: BOFFX + c * (BW + BPAD), y: BOFFY + r * (BH + BPAD), w: BW, h: BH, alive: true, color: colors[(r + c) % colors.length] });
          }
          return b;
        }
        function reset(lvl) {
          level = lvl || 1;
          const rows = Math.min(ROWS + (level - 1) * 2, Math.floor((H/S - 30) / (BH + BPAD)));
          bricks = initBricks(rows);
          ball = { x: W/S/2, y: H/S - 18, dx: 1.2, dy: -1.2, r: 2 };
          paddle = { x: W/S/2 - 12, y: H/S - 12, w: 24, h: 3, dir: 1 };
          state = 'play';
          stateTimer = 0;
        }
        reset(1);

        function render() {
          ctx.fillStyle = '#0a0a20';
          ctx.fillRect(0, 0, W, H);

          if (state === 'play') {
            paddle.x += paddle.dir * 0.8;
            if (paddle.x + paddle.w > W/S - 2) paddle.dir = -1;
            if (paddle.x < 2) paddle.dir = 1;
            const targetX = ball.x - paddle.w / 2;
            paddle.x += (targetX - paddle.x) * 0.06;

            ball.x += ball.dx;
            ball.y += ball.dy;
            if (ball.x - ball.r < 0 || ball.x + ball.r > W/S) ball.dx = -ball.dx;
            if (ball.y - ball.r < 0) ball.dy = -ball.dy;

            if (ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 2 && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
              ball.dy = -Math.abs(ball.dy);
              ball.dx += (ball.x - (paddle.x + paddle.w/2)) * 0.08;
            }
            if (ball.y > H/S) { ball.y = H/S - 18; ball.dy = -Math.abs(ball.dy); }

            let hitCount = 0;
            bricks.forEach(b => {
              if (!b.alive) return;
              if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
                b.alive = false; ball.dy = -ball.dy; hitCount++;
              }
            });

            const alive = bricks.filter(b => b.alive).length;
            if (alive === 0) {
              state = 'win'; stateTimer = 0;
            }
          }

          // Draw bricks
          bricks.forEach(b => {
            if (!b.alive) return;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x * S, b.y * S, b.w * S, b.h * S);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(b.x * S, b.y * S, b.w * S, 1 * S);
          });
          // Paddle
          ctx.fillStyle = '#00e676';
          ctx.fillRect(paddle.x * S, paddle.y * S, paddle.w * S, paddle.h * S);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fillRect(paddle.x * S, paddle.y * S, paddle.w * S, 1 * S);
          // Ball
          ctx.fillStyle = '#fff';
          ctx.fillRect((ball.x - ball.r) * S, (ball.y - ball.r) * S, ball.r * 2 * S, ball.r * 2 * S);
          // Ball trail
          ctx.fillStyle = 'rgba(224,64,251,0.3)';
          ctx.fillRect((ball.x - ball.dx * 2 - ball.r) * S, (ball.y - ball.dy * 2 - ball.r) * S, ball.r * 2 * S, ball.r * 2 * S);

          if (state === 'win') {
            stateTimer++;
            ctx.fillStyle = '#0a0a20';
            ctx.fillRect(0, 0, W, H);
            // Paddle still visible
            ctx.fillStyle = '#00e676';
            ctx.fillRect(paddle.x * S, paddle.y * S, paddle.w * S, paddle.h * S);

            if (stateTimer < 60) {
              ctx.font = 'bold 28px "Courier Prime", monospace';
              ctx.textAlign = 'center';
              ctx.fillStyle = '#ffea00';
              ctx.fillText('YOU WIN!', W/2, H/2 - 10);
              ctx.font = '14px "VT323", monospace';
              ctx.fillStyle = '#666680';
              ctx.fillText('Level ' + level + ' cleared', W/2, H/2 + 14);
            } else if (stateTimer < 70) {
              ctx.font = 'bold 20px "Courier Prime", monospace';
              ctx.textAlign = 'center';
              ctx.fillStyle = '#e040fb';
              ctx.fillText('LEVEL ' + (level + 1), W/2, H/2);
            } else {
              reset(level + 1);
            }
          }

          if (level > 3 && state === 'play' && bricks.filter(b => b.alive).length > bricks.length * 0.9) {
            stateTimer++;
            if (stateTimer > 180) reset(1);
          }

          anim = requestAnimationFrame(render);
        }
        render();
        return () => cancelAnimationFrame(anim);
      }, []);

      return (
        <a href="https://aaronunify2.github.io/UnifyVersion1/3d194.html" target="_blank" rel="noopener"
          style={{ display: "block", border: "2px solid #e040fb", background: "#0a0a20", overflow: "hidden", cursor: "pointer", textDecoration: "none", transition: "border-color 0.2s" }}
          onMouseEnter={e => e.currentTarget.style.borderColor = "#ff80ff"}
          onMouseLeave={e => e.currentTarget.style.borderColor = "#e040fb"}
        >
          <canvas ref={canvasRef} width={570} height={180}
            style={{ width: "100%", height: "auto", display: "block", imageRendering: "pixelated" }} />
          <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px", borderTop: "1px solid #3a1040" }}>
            <div>
              <div style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e8e8d0" }}>3D194 Brick Breaker</div>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#e040fb", marginTop: "2px" }}>This ball has been breaking bricks for eternity and it has learned nothing. Sound familiar?</div>
            </div>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: "14px", color: "#e040fb", background: "#e040fb22", padding: "4px 12px", border: "1px solid #e040fb55", letterSpacing: "1px" }}>PLAY</div>
          </div>
        </a>
      );
    }

    function LoneClownBanner({ onClick }) {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = 570, H = 170, S = 2;
        let anim, f = 0;
        const vanX = { v: W/S * 0.4 };
        let vanDX = 0.6, vanWobble = 0;

        function px(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(x*S,y*S,w*S,h*S); }

        function drawMoon(x, y) {
          ctx.fillStyle = '#e8e8b0';
          ctx.beginPath(); ctx.arc(x*S, y*S, 14*S, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#d8d8a0';
          ctx.beginPath(); ctx.arc((x+2)*S, (y-1)*S, 12*S, 0, Math.PI*2); ctx.fill();
        }

        function drawTree(ox, oy, h, dark) {
          const tc = dark ? '#1a2a1a' : '#0f1f0f';
          const lc = dark ? ['#0a1a0a','#0f220f','#122812'] : ['#0a140a','#0d1a0d','#101e10'];
          px(ox+3, oy+h-16, 3, 16, tc);
          px(ox-2, oy, 13, h-16, lc[0]);
          px(ox-1, oy+2, 11, h-18, lc[1]);
          px(ox+1, oy+4, 7, h-20, lc[2]);
          px(ox+3, oy-3, 3, 5, lc[0]);
        }

        function drawVan(x, y, wobble) {
          const wy = Math.sin(wobble) * 0.8;
          const vy = y + wy;
          px(x, vy-12, 20, 10, '#d8d8d0');
          px(x+1, vy-11, 7, 4, '#4a6a8a');
          px(x+12, vy-11, 7, 4, '#4a6a8a');
          px(x-1, vy-2, 22, 4, '#c0c0b8');
          px(x+2, vy+2, 4, 2, '#222');
          px(x+15, vy+2, 4, 2, '#222');
          // headlights
          ctx.fillStyle = 'rgba(255,255,180,0.15)';
          ctx.beginPath();
          ctx.moveTo((x+20)*S, (vy-6)*S);
          ctx.lineTo((x+45)*S, (vy-14)*S);
          ctx.lineTo((x+45)*S, (vy+4)*S);
          ctx.closePath();
          ctx.fill();
        }

        function render() {
          f++;
          ctx.fillStyle = '#060812';
          ctx.fillRect(0, 0, W, H);

          // Stars
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 30; i++) {
            const sx = (i * 73 + 11) % (W/S), sy = (i * 37 + 7) % 50;
            const twinkle = Math.sin(f * 0.02 + i) > 0.5 ? 1 : 0;
            if (twinkle) ctx.fillRect(sx*S, sy*S, S, S);
          }

          drawMoon(W/S * 0.72, 20);

          // Fog
          ctx.fillStyle = 'rgba(100,120,140,0.04)';
          for (let i = 0; i < 5; i++) {
            const fx = ((f * 0.15 + i * 60) % (W/S + 40)) - 20;
            ctx.fillRect(fx*S, (55+i*3)*S, 50*S, 6*S);
          }

          // Back trees
          for (let i = 0; i < 12; i++) drawTree(i * 25 - 5, 20 + (i%3)*4, 40 + (i%2)*8, true);

          // Dirt road
          px(0, 70, W/S, 16, '#2a1f14');
          px(0, 71, W/S, 14, '#33261a');
          // Road texture
          for (let i = 0; i < 15; i++) px(((i*19+f*0.3)%(W/S)), 76, 6, 1, '#3d2e20');

          // Van
          vanWobble += 0.12;
          vanX.v += vanDX + Math.sin(f * 0.03) * 0.3;

        ];

            const hw = n.w/2, hh = n.h/2;

          }
          const hw = n.w/2, hh = n.h/2;
          const sx = dx === 0 ? Infinity : hw/Math.abs(dx);
          const sy = dy === 0 ? Infinity : hh/Math.abs(dy);

        }

          ctx.fillRect(0,0,W,H);

          bg.addColorStop(0,'#0b1220'); bg.addColorStop(0.6,'#141c2c'); bg.addColorStop(1,'#0a0e18');
          ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
          // warm glow pool
          const g = ctx.createRadialGradient(LX,LY,4,LX,LY,120*fl);
          g.addColorStop(0,'rgba(255,214,140,0.55)');
          g.addColorStop(0.35,'rgba(230,150,60,0.22)');
          g.addColorStop(1,'rgba(230,150,60,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(LX,LY,120*fl,0,Math.PI*2); ctx.fill();
          // lantern body
          ctx.strokeStyle = '#3a2c18'; ctx.lineWidth = 3;
          ctx.strokeRect(LX-11, LY-16, 22, 30);
          ctx.beginPath(); ctx.moveTo(LX-11,LY-16); ctx.lineTo(LX,LY-25); ctx.lineTo(LX+11,LY-16); ctx.stroke();
          ctx.beginPath(); ctx.arc(LX, LY-29, 4, 0, Math.PI*2); ctx.stroke();
          // flame
          const fh = 11*fl;
          const fg = ctx.createRadialGradient(LX,LY-2,0,LX,LY-2,fh);
          fg.addColorStop(0,'#fff6d8'); fg.addColorStop(0.5,'#ffc84a'); fg.addColorStop(1,'rgba(255,120,20,0)');
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.ellipse(LX,LY-2,5*fl,fh,0,0,Math.PI*2); ctx.fill();
          // embers rising
          for (const e of embers){
            e.y -= e.v; e.o -= 0.004;
            if (e.o<=0){ e.x=LX+(Math.random()-0.5)*26; e.y=LY-6; e.v=0.15+Math.random()*0.3; e.o=0.7+Math.random()*0.3; }
            ctx.fillStyle = `rgba(255,190,90,${Math.max(0,e.o)*0.8})`;
            ctx.fillRect(e.x, e.y, 1.6, 1.6);
          }
          // phantom eyes far right, in the murk
          const blink = (Math.sin(f*0.015)>-0.92) ? 1 : 0;
          if (blink){
            const eo = 0.35 + 0.15*Math.sin(f*0.03);
            ctx.fillStyle = `rgba(170,190,215,${eo})`;
            ctx.beginPath(); ctx.ellipse(W-92, H*0.42, 4, 5.5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(W-72, H*0.44, 4, 5.5, 0, 0, Math.PI*2); ctx.fill();
          }
          // fog drifts, retreating from the lantern
          for (const p of fog){
            p.x += p.s;
            if (p.x - p.r > W) p.x = -p.r;
            const dx = p.x-LX, dy = p.y-LY;
            const d = Math.sqrt(dx*dx+dy*dy);
            const repel = Math.max(0, 1 - d/(135*fl));
            const px = p.x + dx/d * repel * 34;
            const py = p.y + dy/d * repel * 34;
            const o = p.o * (1 - repel*0.9);
            const fgr = ctx.createRadialGradient(px,py,0,px,py,p.r);
            fgr.addColorStop(0,`rgba(150,165,190,${o})`); fgr.addColorStop(1,'rgba(150,165,190,0)');
            ctx.fillStyle = fgr; ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
          }
          // vignette
          const v = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,W*0.62);
          v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.55)');
          ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
          anim = requestAnimationFrame(render);
        }
        render();
        return () => cancelAnimationFrame(anim);
      }, []);
      return (
        <a href="https://aaronunify2.github.io/UnifyVersion1/TommyPhantom.html" target="_blank" rel="noopener"
          onClick={e => { if (onClick) { e.preventDefault(); onClick(); } }}

    function ProblemsBanner({ onClick }) {
      const canvasRef = React.useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const EMBER = [201, 79, 50], CALM = [78, 100, 128];
        const GLOW = '#ffab84', CALM_CSS = 'rgb(78,100,128)';

        // A field of attention: 30 x 6 cells, mostly quiet.
        const STEP = 19, CELL = 15, COLS = 30, ROWS = 6;
        const offX = 2, offY = 12;

        // Five problems. They bloom until they are the only thing you can see,
        // then clear one at a time and hand the capacity back.
        const CYCLE = 840, BLOOM = 260, RING = 45;
        const problems = [
          { cx: 4,  cy: 1, resolveAt: 300 },
          { cx: 11, cy: 4, resolveAt: 400 },
          { cx: 17, cy: 2, resolveAt: 500 },
          { cx: 23, cy: 5, resolveAt: 600 },
          { cx: 28, cy: 1, resolveAt: 700 }
        ];

        function mix(a, b, t) {
          return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ','
                        + Math.round(a[1] + (b[1] - a[1]) * t) + ','
                        + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
        }

        let anim, frame = 0;
        function render() {
          frame++;
          const f = frame % CYCLE;

          ctx.fillStyle = '#0d0a10';
          ctx.fillRect(0, 0, W, H);

          const bloom = Math.min(1, f / BLOOM);
          const live = problems.filter(p => f < p.resolveAt);
          const pressure = (live.length / problems.length) * bloom;
          const avail = 1 - pressure;   // the good cells dim as problems take over, and come back as they clear
          const reach = 2.6 + bloom * 3.2;

          for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS; r++) {
              let inf = 0;
              for (const p of live) {
                const d = Math.hypot(c - p.cx, (r - p.cy) * 1.6);
                inf = Math.max(inf, Math.max(0, 1 - d / reach));
              }
              inf *= 0.15 + 0.85 * bloom;
              const breathe = 0.86 + 0.14 * Math.sin(frame * 0.05 + c * 0.4 + r * 0.7);
              if (inf > 0.02) {
                ctx.globalAlpha = (0.35 + 0.65 * inf) * breathe;
                ctx.fillStyle = mix(CALM, EMBER, Math.min(1, inf * 1.4));
              } else {
                ctx.globalAlpha = (0.12 + 0.62 * avail) * breathe;
                ctx.fillStyle = CALM_CSS;
              }
              ctx.fillRect(offX + c * STEP, offY + r * STEP, CELL, CELL);
            }
          }
          ctx.globalAlpha = 1;

          // Each problem clears with a ring, and the field breathes back.
          for (const p of problems) {
            const age = f - p.resolveAt;
            if (age >= 0 && age < RING) {
              const t = age / RING;
              ctx.globalAlpha = 1 - t;
              ctx.strokeStyle = GLOW;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(offX + p.cx * STEP + CELL / 2, offY + p.cy * STEP + CELL / 2, 6 + t * 130, 0, Math.PI * 2);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }

          // The capacity you get back each time one clears.
          const barW = 140, barX = W - barW - 14, barY = H - 14;
          ctx.strokeStyle = 'rgba(201,79,50,0.45)';
          ctx.lineWidth = 1;
          ctx.strokeRect(barX, barY, barW, 8);
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = GLOW;
          ctx.fillRect(barX + 1, barY + 1, (barW - 2) * (1 - pressure), 6);
          ctx.globalAlpha = 1;

          ctx.font = '14px "VT323", monospace';
          ctx.textBaseline = 'alphabetic';
          ctx.textAlign = 'right';
          ctx.fillStyle = '#8a7a72';
          ctx.fillText('ATTENTION', barX - 8, barY + 8);
          ctx.textAlign = 'left';
          ctx.fillStyle = 'rgba(255,171,132,' + (0.3 + 0.4 * pressure) + ')';
          ctx.fillText(live.length + ' UNRESOLVED', 14, barY + 8);

          anim = requestAnimationFrame(render);
        }
        render();
        return () => cancelAnimationFrame(anim);
      }, []);

      return (
        <div onClick={onClick}
          style={{ display: "block", border: "2px solid #c94f32", background: "#0d0a10", overflow: "hidden", cursor: "pointer", textDecoration: "none", transition: "border-color 0.2s" }}
          onMouseEnter={e => e.currentTarget.style.borderColor = "#e8714f"}
          onMouseLeave={e => e.currentTarget.style.borderColor = "#c94f32"}
        >
          <canvas ref={canvasRef} width={570} height={150}
            style={{ width: "100%", height: "auto", display: "block" }} />
          <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px", borderTop: "1px solid #2a1512" }}>

              <div style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#e08b6a", marginTop: "2px" }}>You can have ninety percent of what you want and still be miserable.</div>
            </div>

          </div>
        </div>
      );

            <div style={{ maxWidth: "500px", margin: "0 auto", padding: "16px 0" }}>
              <p style={{ fontFamily: "'Lora', serif", fontSize: "15px", fontStyle: "italic", color: "#a0a090", lineHeight: 1.7 }}>Property as defense. Global equities as offense. Inflation as fuel. A practical framework for building wealth over decades using borrowed money, compound growth, and patience.</p>
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
            {stratArticles.map((a, i) => (
              <div key={a.id} onClick={() => onSelect(a.id)}
                style={{ border: "1px solid #333366", padding: "16px 20px", cursor: "pointer", background: "#0f0f23", display: "flex", justifyContent: "space-between", alignItems: "center", transition: "border-color 0.2s", gap: "12px" }}
                onMouseEnter={e => e.currentTarget.style.borderColor = "#e67e22"}
                onMouseLeave={e => e.currentTarget.style.borderColor = "#333366"}
              >
                <div style={{ display: "flex", gap: "16px", alignItems: "baseline", flex: 1, minWidth: 0 }}>
                  <span style={{ fontFamily: "'VT323', monospace", fontSize: "18px", color: "#e67e22", flexShrink: 0 }}>{String(i + 1).padStart(2, '0')}</span>
                  <div>
                    <span style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e8e8d0" }}>{a.title}</span>
                    <p style={{ fontFamily: "'Courier Prime', monospace", fontSize: "13px", color: "#888880", fontStyle: "italic", marginTop: "2px" }}>{redact(a.subtitle)}</p>
                  </div>
                </div>
                <span style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#555560", whiteSpace: "nowrap" }}>{new Date(a.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ArticlesPage({ content, selectedArticle, setSelectedArticle }) {
      const articles = content.articles || [];
      const econArticles = articles.filter(a => a.category === "Economics" && !a.comingSoon);
      const finArticles = articles.filter(a => a.category === "Finance" && !a.comingSoon);
      const stratArticles = articles.filter(a => a.category === "Strategy" && !a.comingSoon);
      const seriesIds = ["econ-series", "finance-series", "strategy-series"];
      const selected = seriesIds.includes(selectedArticle) ? null : (selectedArticle ? articles.find(a => a.id === selectedArticle) : null);
      const showEconSeries = selectedArticle === "econ-series";
      const showFinSeries = selectedArticle === "finance-series";
      const showStratSeries = selectedArticle === "strategy-series";
      const { data: articleData, loading } = useJsonFile(selected && !selected.comingSoon ? selected.file : null);

      const isEcon = selected ? econArticles.findIndex(a => a.id === selected.id) >= 0 : false;
      const isFin = selected ? finArticles.findIndex(a => a.id === selected.id) >= 0 : false;
      const isStrat = selected ? stratArticles.findIndex(a => a.id === selected.id) >= 0 : false;
      const seriesArticles = isEcon ? econArticles : isFin ? finArticles : isStrat ? stratArticles : [];
      const seriesIdx = seriesArticles.findIndex(a => a.id === (selected?.id));
      const prevSeries = seriesIdx > 0 ? seriesArticles[seriesIdx - 1] : null;
      const nextSeries = seriesIdx >= 0 && seriesIdx < seriesArticles.length - 1 ? seriesArticles[seriesIdx + 1] : null;
      const seriesId = isEcon ? "econ-series" : isFin ? "finance-series" : isStrat ? "strategy-series" : null;

      if (selected && !selected.comingSoon && articleData) return (
        <div>
          <ArticleRenderer data={articleData} goBack={() => setSelectedArticle(seriesId)} />
          {seriesId && (
            <div style={{ maxWidth: "720px", display: "flex", justifyContent: "space-between", marginTop: "20px", paddingTop: "16px", borderTop: "1px dashed #333366", gap: "12px", flexWrap: "wrap" }}>
              {prevSeries ? <button onClick={() => { setSelectedArticle(prevSeries.id); window.scrollTo({top:0,behavior:"smooth"}); }} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", padding: 0, textAlign: "left" }}>{"\u2190 " + prevSeries.title}</button> : <span />}
              <button onClick={() => { setSelectedArticle(seriesId); window.scrollTo({top:0,behavior:"smooth"}); }} style={{ background: "none", border: "1px solid #333366", color: "#666680", fontFamily: "'VT323', monospace", fontSize: "13px", padding: "4px 12px", cursor: "pointer" }}>All Articles</button>
              {nextSeries ? <button onClick={() => { setSelectedArticle(nextSeries.id); window.scrollTo({top:0,behavior:"smooth"}); }} style={{ background: "none", border: "none", color: "#4a9aea", fontFamily: "'Courier Prime', monospace", fontSize: "14px", cursor: "pointer", padding: 0, textAlign: "right" }}>{nextSeries.title + " \u2192"}</button> : <span />}
            </div>
          )}
        </div>
      );
      if (selected && !selected.comingSoon && loading) return <div style={{ fontFamily: "'VT323', monospace", color: "#666680", padding: "40px", textAlign: "center", fontSize: "18px" }}>Loading...</div>;
      if (showEconSeries) return <EconSeriesPage articles={articles} onSelect={id => { setSelectedArticle(id); window.scrollTo({top:0,behavior:"smooth"}); }} goBack={() => setSelectedArticle(null)} />;
      if (showFinSeries) return <FinanceSeriesPage articles={articles} onSelect={id => { setSelectedArticle(id); window.scrollTo({top:0,behavior:"smooth"}); }} goBack={() => setSelectedArticle(null)} />;
      if (showStratSeries) return <StrategySeriesPage articles={articles} onSelect={id => { setSelectedArticle(id); window.scrollTo({top:0,behavior:"smooth"}); }} goBack={() => setSelectedArticle(null)} />;
      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: "24px", flexWrap: "wrap", gap: "12px" }}>
            <SectionHeader title="Articles" subtitle="Essays and ideas" />
            <UsersOnlineCounter />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
            {articles.map(a => (
              <div key={a.id} onClick={() => !a.comingSoon && setSelectedArticle(a.id)}
                style={{ border: "1px solid " + (a.comingSoon ? "#222244" : "#333366"), padding: "24px", cursor: a.comingSoon ? "default" : "pointer", background: "#0f0f23", transition: "border-color 0.2s", opacity: a.comingSoon ? 0.5 : 1 }}
                onMouseEnter={e => { if (!a.comingSoon) e.currentTarget.style.borderColor="#4a9aea"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = a.comingSoon ? "#222244" : "#333366"; }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: "8px" }}>
                  <div>
                    <div style={{ fontFamily: "'VT323', monospace", fontSize: "12px", color: "#4a4a8a", letterSpacing: "2px", marginBottom: "6px" }}>{a.category}{a.comingSoon ? " \u00b7 COMING SOON" : ""}</div>
                    <h3 style={{ fontFamily: "'Special Elite', monospace", fontSize: "22px", color: a.comingSoon ? "#666680" : "#e8e8d0", marginBottom: "4px" }}>{a.title}</h3>
                    <p style={{ fontFamily: "'Courier Prime', monospace", fontSize: "14px", color: "#888880", fontStyle: "italic" }}>{redact(a.subtitle)}</p>
                  </div>
                  {!a.comingSoon && <span style={{ fontFamily: "'VT323', monospace", fontSize: "14px", color: "#555560", whiteSpace: "nowrap" }}>{new Date(a.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>}
                </div>
              </div>
            ))}
            {articles.length===0 && <p style={{ color: "#555560", fontStyle: "italic" }}>No articles yet. Check back soon.</p>}
          </div>
        </div>
      );
    }

    function NovelPage({ content }) {
      const novel = content.novel || {};
      const chapters = novel.chapters || [];
      const [selectedId, setSelectedId] = useState(null);
      const selected = selectedId ? chapters.find(c => c.id === selectedId) : null;
      const { data: chapterData } = useJsonFile(selected?.file || null);
      const [synopsis] = useState(() => {
        const s = novel.synopsis;
        if (Array.isArray(s)) return s[Math.floor(Math.random() * s.length)];
        return s || "";
      });

      if (selected && chapterData) {
        return <ChapterRenderer data={chapterData} chapterMeta={selected} allChapters={chapters} goBack={() => setSelectedId(null)} onNav={id => { setSelectedId(id); window.scrollTo({top:0,behavior:"smooth"}); }} />;
      }

      return (
        <div>
          <div style={{ border: "2px solid #333366", background: "linear-gradient(180deg, #12122a 0%, #0f0f23 100%)", padding: "40px", textAlign: "center", marginBottom: "28px" }}>
            <div style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#4a4a8a", letterSpacing: "4px", textTransform: "uppercase", marginBottom: "12px" }}>{novel.genre}</div>
            <h2 style={{ fontFamily: "'Special Elite', monospace", fontSize: "42px", color: "#e8e8d0", letterSpacing: "4px", textTransform: "uppercase", marginBottom: "8px" }}>{novel.title}</h2>
            <div style={{ fontFamily: "'Courier Prime', monospace", fontSize: "14px", color: "#666680", marginBottom: "20px" }}>by {content.site?.author}</div>
            <div style={{ maxWidth: "500px", margin: "0 auto", padding: "20px", borderTop: "1px solid #333366", borderBottom: "1px solid #333366" }}>
              <p style={{ fontFamily: "'Lora', serif", fontSize: "15px", fontStyle: "italic", color: "#a0a090", lineHeight: 1.7 }}>{synopsis}</p>
            </div>
          </div>
          {novel.comingSoon && chapters.length === 0 ? (
            <div style={{ border: "1px dashed #333366", padding: "40px", textAlign: "center" }}>
              <div style={{ fontFamily: "'VT323', monospace", fontSize: "24px", color: "#e67e22", letterSpacing: "3px", marginBottom: "16px" }}>COMING SOON</div>
              <p style={{ fontSize: "16px", lineHeight: 1.8, color: "#888880", maxWidth: "500px", margin: "0 auto" }}>{novel.message}</p>
              {content.site?.twitter && <div style={{ marginTop: "24px" }}><a href={content.site.twitter} target="_blank" rel="noopener" style={{ fontFamily: "'Courier Prime', monospace", fontSize: "14px", color: "#4a9aea" }}>{"Follow on X for updates \u2192"}</a></div>}
              {novel.plugMessage && <div style={{ marginTop: "24px", paddingTop: "20px", borderTop: "1px dashed #333366" }}><p style={{ fontSize: "15px", color: "#888880", lineHeight: 1.7 }}>{novel.plugMessage}</p>{novel.plugUrl && <a href={novel.plugUrl} target="_blank" rel="noopener" style={{ display: "inline-block", marginTop: "12px", background: "#e67e22", color: "#fff", padding: "8px 24px", fontFamily: "'Courier Prime', monospace", fontSize: "13px", fontWeight: "bold", letterSpacing: "2px", textTransform: "uppercase", textDecoration: "none" }}>{(novel.plugLabel || "Try it") + " \u2192"}</a>}</div>}
            </div>
          ) : (
            <div>
              <SectionHeader title="Chapters" />
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                {chapters.map((ch, i) => (
                  <div key={ch.id} onClick={() => setSelectedId(ch.id)} style={{ border: "1px solid #333366", padding: "16px 20px", cursor: "pointer", background: "#0f0f23", display: "flex", justifyContent: "space-between", alignItems: "center", transition: "border-color 0.2s" }} onMouseEnter={e => e.currentTarget.style.borderColor="#e67e22"} onMouseLeave={e => e.currentTarget.style.borderColor="#333366"}>
                    <div style={{ display: "flex", gap: "16px", alignItems: "baseline" }}>
                      <span style={{ fontFamily: "'VT323', monospace", fontSize: "18px", color: "#e67e22" }}>{String(i+1).padStart(2, '0')}</span>
                      <span style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e8e8d0" }}>{ch.title}</span>
                    </div>
                    <span style={{ fontFamily: "'VT323', monospace", fontSize: "13px", color: "#555560" }}>{new Date(ch.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function AboutPage({ content }) {
      const site = content.site || {};
      return (
        <div>
          <SectionHeader title="About" subtitle="The story behind The Post Idealist" />
          <div style={{ border: "1px solid #333366", background: "#0f0f23", padding: "32px", maxWidth: "680px" }}>
            <p style={{ fontSize: "16px", lineHeight: 1.9, color: "#c0c0b0", marginBottom: "20px" }}><span style={{ fontFamily: "'Special Elite', monospace", fontSize: "42px", color: "#e67e22", float: "left", lineHeight: "36px", marginRight: "8px", marginTop: "4px" }}>T</span>{"he Post Idealist is a home for tools, writing, and ideas. The tools are built to solve real problems without harvesting your data. The articles are experiments in form. The novel is being written in public because shipping beats perfecting."}</p>
            <p style={{ fontSize: "16px", lineHeight: 1.9, color: "#c0c0b0" }}>Everything here runs on the same principle: your attention is yours. No tracking, no ads, no algorithmic manipulation.</p>
            <div style={{ borderTop: "1px dashed #333366", marginTop: "28px", paddingTop: "20px" }}>
              <h3 style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e67e22", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>Colophon</h3>
              <div style={{ fontFamily: "'Courier Prime', monospace", fontSize: "14px", color: "#888880", lineHeight: 1.8 }}>
                <p>Author: {site.author}</p><p>Built with: HTML, JavaScript, stubbornness</p><p>Hosted on: GitHub Pages</p><p>Established: {site.established}</p><p>Data collected: None</p>
              </div>
            </div>
            {site.twitter && <div style={{ borderTop: "1px dashed #333366", marginTop: "20px", paddingTop: "20px" }}><h3 style={{ fontFamily: "'Special Elite', monospace", fontSize: "18px", color: "#e67e22", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>Find Me</h3><a href={site.twitter} target="_blank" rel="noopener" style={{ fontFamily: "'Courier Prime', monospace", fontSize: "15px", color: "#4a9aea" }}>@UGoalsetter on X/Twitter</a></div>}
          </div>
        </div>
      );
    }

    // ==========================================
    // ROUTING
    // ==========================================
    // Every view has an address: #/articles/lone-clown, #/tools/clipboard,
    // #/novel, #/about, #/articles, #/ for the feed. A bare #lone-clown is
    // read as an article id and rewritten to the canonical form on load.
    const ROUTE_PAGES = ["home", "tools", "articles", "novel", "about"];

    function parseHash() {
      const raw = (window.location.hash || "").replace(/^#\/?/, "").replace(/\/+$/, "");
      let parts;
      try { parts = raw.split("/").filter(Boolean).map(decodeURIComponent); }
      catch (e) { parts = raw.split("/").filter(Boolean); }
      if (!parts.length) return { page: "home", tool: null, article: null };
      const head = parts[0], id = parts[1] || null;
      if (head === "tools") return { page: "tools", tool: id, article: null };
      if (head === "articles") return { page: "articles", tool: null, article: id };
      if (ROUTE_PAGES.indexOf(head) >= 0) return { page: head, tool: null, article: null };
      return { page: "articles", tool: null, article: head };
    }

    function buildHash(page, tool, article) {
      if (page === "tools") return tool ? "#/tools/" + encodeURIComponent(tool) : "#/tools";
      if (page === "articles") return article ? "#/articles/" + encodeURIComponent(article) : "#/articles";
      if (page === "home") return "#/";
      return "#/" + page;
    }

    // ==========================================
    // APP
    // ==========================================
    function App() {
      const { content, loading } = useContent();
      const [currentPage, setCurrentPage] = useState(() => parseHash().page);
      const [selectedTool, setSelectedTool] = useState(() => parseHash().tool);
      const [selectedArticle, setSelectedArticle] = useState(() => parseHash().article);
      const setPage = useCallback(page => { setCurrentPage(page); if(page!=="tools") setSelectedTool(null); if(page!=="articles") setSelectedArticle(null); window.scrollTo({top:0,behavior:"smooth"}); }, []);

      // Keep the address bar in step with what's on screen so any view can be
      // copied and shared. replaceState, not location.hash: no history pile-up,
      // so Back still leaves the site rather than stepping back through clicks.
      useEffect(() => {
        const next = buildHash(currentPage, selectedTool, selectedArticle);
        if (window.location.hash !== next) window.history.replaceState(null, "", next);
      }, [currentPage, selectedTool, selectedArticle]);

      // Someone edits the URL, or arrives via back/forward across hash entries.
      useEffect(() => {
        const onHash = () => {
          const r = parseHash();
          setCurrentPage(r.page); setSelectedTool(r.tool); setSelectedArticle(r.article);
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      if (loading) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", fontFamily: "'VT323', monospace", fontSize: "24px", color: "#4a4a8a" }}>Loading The Post Idealist...</div>;
      if (!content) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", fontFamily: "'Courier Prime', monospace", fontSize: "16px", color: "#aa3333", textAlign: "center", padding: "20px" }}>Failed to load content.json.</div>;
      const pg = () => {
        switch(currentPage) {
          case "home": return <HomePage content={content} setPage={setPage} setSelectedTool={setSelectedTool} setSelectedArticle={setSelectedArticle} />;
          case "tools": return <ToolsPage content={content} selectedTool={selectedTool} setSelectedTool={setSelectedTool} />;
          case "articles": return <ArticlesPage content={content} selectedArticle={selectedArticle} setSelectedArticle={setSelectedArticle} />;
          case "novel": return <NovelPage content={content} />;
          case "about": return <AboutPage content={content} />;
          default: return <HomePage content={content} setPage={setPage} setSelectedTool={setSelectedTool} setSelectedArticle={setSelectedArticle} />;
        }
      };
      return (
        <div style={{ maxWidth: "1100px", margin: "0 auto", minHeight: "100vh", display: "flex", flexDirection: "column", background: "#1a1a2e", boxShadow: "0 0 60px rgba(0,0,0,0.5)" }}>
          <Header currentPage={currentPage} setPage={setPage} site={content.site} />
          <div className="site-layout" style={{ display: "flex", gap: "24px", padding: "24px 20px", flex: 1 }}>
            <main className="site-main" style={{ flex: 1, minWidth: 0 }}>{pg()}</main>
            <Sidebar site={content.site} />
          </div>
          <Footer site={content.site} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
